[package]
name = "mrow"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Mrow: a review queue for GitLab and GitHub, drawn with Rune."

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0", features = ["markdown"] }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSDockTile", "NSResponder"] }

[features]
# Headless per-frame timings: RUNE_FRAME_LOG=frames.jsonl with --script and --frames.
profile = ["rune/frame-profile"]

[profile.release]
debug = "line-tables-only"

# Benchmarks and the numbers in the README come from here.
[profile.perf]
inherits = "release"
debug = "line-tables-only"
