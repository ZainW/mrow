[package]
name = "mrow"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
description = "Mrow: a review queue for GitLab and GitHub, drawn with Rune."

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "dbd9335bd59b479d5f894c36d49648a725c6213d" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "dbd9335bd59b479d5f894c36d49648a725c6213d", features = ["markdown"] }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "dbd9335bd59b479d5f894c36d49648a725c6213d" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "3", default-features = false }
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSDockTile", "NSResponder"] }

# Banners on Linux go over D-Bus. Rune already builds zbus for accessibility; keep the same major.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[features]
# Headless per-frame timings: RUNE_FRAME_LOG=frames.jsonl with --script and --frames.
profile = ["rune/frame-profile"]

[profile.release]
debug = "line-tables-only"

# Benchmarks and the numbers in the README come from here.
[profile.perf]
inherits = "release"
debug = "line-tables-only"

# Rune builds these crates as published plus its own patches (Rune's Cargo.toml says what each
# changes: parley_engine's bidi fix and faster shaping, winit's input-method clauses on macOS, the
# Windows-only wgpu-hal and accesskit_windows). A dependency's `[patch]` doesn't reach the app that
# uses it, so every app on Rune repeats them, at the same rev as Rune. Keep the wgpu crates at the
# version Rune locks (30.0.1 here: `cargo update -p wgpu --precise`), or the wgpu-hal patch goes unused.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "dbd9335bd59b479d5f894c36d49648a725c6213d" }
winit = { git = "https://github.com/anomalyco/rune", rev = "dbd9335bd59b479d5f894c36d49648a725c6213d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "dbd9335bd59b479d5f894c36d49648a725c6213d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "dbd9335bd59b479d5f894c36d49648a725c6213d" }
