# Pull requests that touch the app: formatting, then a warning-free compile of every target
# (tests included) against the locked dependencies. No build artifacts, no tests run, Linux
# only; a release builds and runs everything.
name: Check desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/check-desktop.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install; rustup component add rustfmt
      - name: Formatting
        run: cargo fmt --check
      - name: Linux build packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          shared-key: check
      - name: Compiles
        run: cargo check --locked --all-targets
