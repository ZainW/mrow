name: Mac app

on:
  push:
    branches: [main]
    paths: ["apps/mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["apps/mac/**", ".github/workflows/mac.yml"]

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and self-test
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - name: Self-test
        run: .build/debug/Mrow --selftest
