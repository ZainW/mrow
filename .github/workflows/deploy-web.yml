# Deploys mrow.wania.app from main: when the site changes on main, after every release (which
# bumps the version the download links name), or by hand (Actions → Deploy web → Run workflow).
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # main rather than the commit that triggered this: after a release that's the version bump.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: The Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret isn't set (a token with Workers Scripts: Edit on the account)."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mrow/web run deploy
      # The deployed pages, read from the build: Cloudflare turns GitHub's runners away (403) from
      # the live site, but wrangler only reports success once these files are being served.
      - name: The download links work
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/Cargo.toml | head -1)"
          links="$(grep -oh 'https://github.com/ZainW/mrow/releases/download/[^"]*' apps/web/dist/client/*.html | sort -u)"
          if ! grep -q "/v$version/mrow-$version-macos-aarch64.zip" <<<"$links"; then
            echo "::error::The site doesn't link to $version's Mac download."
            exit 1
          fi
          while read -r url; do
            code="$(curl -sIL -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url"
            [[ "$code" == 200 ]] || { echo "::error::$url answers $code"; exit 1; }
          done <<<"$links"
