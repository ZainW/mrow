# Deploys mrow.wania.app from main: when the site changes on main, after every release (which
# bumps the version the download links name), or by hand (Actions → Deploy web → Run workflow).
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # main rather than the commit that triggered this: after a release that's the version bump.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: The Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret isn't set (a token with Workers Scripts: Edit on the account)."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mrow/web run deploy
      - name: The live download links work
        run: |
          # The new version can take a few seconds to reach every edge.
          for attempt in 1 2 3 4 5 6; do
            links="$(curl -fsSL "https://mrow.wania.app/download?deploy=$GITHUB_RUN_ID" | grep -o 'https://github.com/ZainW/mrow/releases/download/[^"]*' | sort -u)"
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/Cargo.toml | head -1)"
            if grep -q "/v$version/mrow-$version-macos-aarch64.zip" <<<"$links"; then
              break
            fi
            [[ "$attempt" -lt 6 ]] || { echo "::error::The live site doesn't link to $version's Mac download."; exit 1; }
            sleep 10
          done
          while read -r url; do
            code="$(curl -sIL -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url"
            [[ "$code" == 200 ]] || { echo "::error::$url answers $code"; exit 1; }
          done <<<"$links"
