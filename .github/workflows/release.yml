# A release, run by hand (Actions → Release → Run workflow, or apps/desktop/scripts/release.sh).
# Nothing here runs on push or merge.
#
#   plan     picks the version and checks there's something to release
#   build    macOS (Apple silicon: an archive and a disk image) and Linux (x86_64, arm64) archives,
#            from the planned commit
#   publish  only once every build passed: bumps the version, writes CHANGELOG.md, tags, signs
#            latest.json and publishes the GitHub release that installed apps update from
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version (major.minor.patch); overrides the bump
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main, not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Pick the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -n "$EXACT" ]]; then
            next="${EXACT#v}"
          elif [[ -z "$last" ]]; then
            # The first release ships the version already in Cargo.toml.
            next="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/Cargo.toml | head -1)"
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a major.minor.patch version: $next"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::v$next is already tagged."
            exit 1
          fi
          if [[ -n "$last" && -z "$(git log --oneline "$last..HEAD")" ]]; then
            echo "::error::Nothing has changed since $last."
            exit 1
          fi
          echo "version=$next" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "Releasing $next (after ${last:-nothing}) from $(git rev-parse --short HEAD)"
      - name: Preview the notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "# Mrow $VERSION"
            git-cliff --config cliff.toml --unreleased --tag "v$VERSION" --strip all
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - key: macos-aarch64
            os: macos-26
          - key: linux-x86_64
            os: ubuntu-24.04
          - key: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Release builds update themselves (src/data/update.rs).
      MROW_UPDATES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev pkg-config
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          shared-key: release
      - run: scripts/set-version.sh "$VERSION"
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle.sh
          test "$(dist/Mrow.app/Contents/MacOS/Mrow --version)" = "mrow $VERSION"
          # The archive is what installed copies and the install script fetch; the disk image
          # is the same app for people who download it in a browser.
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/mrow-${{ matrix.key }}.tar.gz" Mrow.app
          scripts/dmg.sh "dist/mrow-${{ matrix.key }}.dmg"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/package-linux.sh
          test "$(target/release/mrow --version)" = "mrow $VERSION"
          test -f "dist/mrow-${{ matrix.key }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.key }}
          path: |
            apps/desktop/dist/mrow-${{ matrix.key }}.tar.gz
            apps/desktop/dist/mrow-${{ matrix.key }}.dmg
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Main hasn't moved since the build
        run: |
          if [[ "$(git rev-parse HEAD)" != "${{ needs.plan.outputs.sha }}" ]]; then
            echo "::error::main moved while this release built. Run the release again."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: The signing key matches the one the app checks
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::The UPDATE_SIGNING_KEY secret isn't set."
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" >"$RUNNER_TEMP/key.pem"
          derived="$(openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          if [[ "$derived" != "$(tr -d ' \n' <apps/desktop/packaging/update-key.hex)" ]]; then
            echo "::error::UPDATE_SIGNING_KEY doesn't match apps/desktop/packaging/update-key.hex; installed apps would refuse this release."
            exit 1
          fi
      - name: Notes, changelog, version commit and tag
        run: |
          git-cliff --config cliff.toml --unreleased --tag "v$VERSION" --strip all >"$RUNNER_TEMP/notes.md"
          if ! grep -q '^- ' "$RUNNER_TEMP/notes.md"; then
            echo "Maintenance release: no new features or fixes." >>"$RUNNER_TEMP/notes.md"
          fi
          git-cliff --config cliff.toml --tag "v$VERSION" -o CHANGELOG.md
          apps/desktop/scripts/set-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md apps/desktop/Cargo.toml apps/desktop/Cargo.lock
          git commit -q -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "Mrow $VERSION"
      - name: Manifest and signature
        run: |
          assets='{}'
          for file in dist/mrow-*.tar.gz; do
            name="$(basename "$file")"
            key="${name#mrow-}"
            key="${key%.tar.gz}"
            sum="$(sha256sum "$file" | cut -d' ' -f1)"
            url="https://github.com/$REPO/releases/download/v$VERSION/$name"
            assets="$(jq -c --arg k "$key" --arg u "$url" --arg s "$sum" '. + {($k): {url: $u, sha256: $s}}' <<<"$assets")"
          done
          for key in macos-aarch64 linux-x86_64 linux-aarch64; do
            jq -e --arg k "$key" 'has($k)' <<<"$assets" >/dev/null || { echo "::error::No $key archive"; exit 1; }
          done
          test -f dist/mrow-macos-aarch64.dmg || { echo "::error::No macOS disk image"; exit 1; }
          jq -n --arg v "$VERSION" --arg n "https://github.com/$REPO/releases/tag/v$VERSION" --argjson a "$assets" \
            '{version: $v, notes_url: $n, assets: $a}' >dist/latest.json
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in dist/latest.json | od -An -tx1 | tr -d ' \n' >dist/latest.json.sig
          rm -f "$RUNNER_TEMP/key.pem"
          test "$(wc -c <dist/latest.json.sig)" -eq 128
          cat dist/latest.json
      - name: Push the commit and tag
        run: git push --atomic origin HEAD:main "v$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$REPO" \
            --title "Mrow $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            --latest
